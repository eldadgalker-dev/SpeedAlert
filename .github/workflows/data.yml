# Refreshes data/cameras.json from OpenStreetMap every hour and commits only a real change.
# The app downloads data/ from main at launch and every 30 minutes; no new APK is needed.
name: data

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour
  push:
    branches: [main]
    paths:
      - "tools/fetch_cameras.py"
      - ".github/workflows/data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fetch cameras (Overpass)
        id: fetch
        run: |
          if python tools/fetch_cameras.py --out "$RUNNER_TEMP/cameras.json"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            # Overpass busy: keep the current data, try again next hour.
            echo "::warning::Overpass fetch failed; data unchanged"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare and accept
        if: steps.fetch.outputs.ok == 'true'
        id: cmp
        run: |
          python - "$RUNNER_TEMP/cameras.json" data/cameras.json <<'PY'
          import json, os, sys
          new, old = (json.load(open(p, encoding="utf-8")) for p in sys.argv[1:3])
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if new["cameras"] == old["cameras"]:
              print("Cameras unchanged"); out.write("changed=false\n"); sys.exit(0)
          # A partial Overpass answer must never wipe the database.
          if len(new["cameras"]) < 0.8 * len(old["cameras"]):
              print(f"::error::Refusing update: {len(new['cameras'])} cameras vs {len(old['cameras'])}"); sys.exit(1)
          print(f"Cameras changed: {len(old['cameras'])} -> {len(new['cameras'])}")
          out.write("changed=true\n")
          PY

      - name: Commit data
        if: steps.cmp.outputs.changed == 'true'
        run: |
          cp "$RUNNER_TEMP/cameras.json" data/cameras.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cameras.json
          git commit -m "Camera data update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
